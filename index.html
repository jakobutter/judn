<html>
<head>
    <title>www.jakobutter.net</title>
    <link href="/style/08.css" rel="stylesheet">
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="jakob utter, jakob, utter, jakobutter, jakobutter website, yung ulcer, yungulcer, legendaire">
    <meta name="description" content="music and art by Jakob Utter">
</head>
<body>
<script src="/scripts/include.js"></script>
<header id="header"></header>

<script>
fetch("releases.json")
  .then(res => res.json())
  .then(releases => {
    document.body.insertAdjacentHTML("beforeend", releases.map(r => `
      <div style="--color1:${r.txt};--color2:${r.window}">
        <a><strong>${r.date}</strong>&nbsp—&nbsp${r.title}</a><br>
        <img src="${r.cover}"><br>
        ${r.youtube    ? `<a href="${r.youtube}"><span class="youtube"></span></a>` : ""}
        ${r.soundcloud ? `<a href="${r.soundcloud}"><span class="soundcloud"></span></a>` : ""}
        ${r.spotify    ? `<a href="${r.spotify}"><span class="spotify"></span></a>` : ""}
        ${r.applemusic ? `<a href="${r.applemusic}"><span class="applemusic"></span></a>` : ""}
        <br>
      </div>
    `).join(""));
  });
</script>

</body>

</html>
