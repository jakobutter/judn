<html>
<head>
    <title>www.jakobutter.net - gallery</title>
    <link href="/style/08.css" rel="stylesheet">
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="jakob utter, jakob, utter, jakobutter, jakobutter website, yung ulcer, yungulcer, legendaire">
    <meta name="description" content="music and art by Jakob Utter">
</head>
<body>
<script src="/scripts/include.js"></script>
<header id="header"></header>
<script>
document.addEventListener("DOMContentLoaded", () => {
  fetch("https://api.github.com/repos/jakobutter/judn/contents/img/gal")
    .then(res => res.json())
    .then(files => {
      files
        .filter(f => /\.(png|jpg|jpeg|gif|bmp|webp)$/i.test(f.name))
        .forEach(f => {
          const div = document.createElement("div");
          const img = document.createElement("img");
          img.src = "/img/gal/" + f.name;
          div.appendChild(img);
          document.body.appendChild(div);
        });
    });
});
</script>
</body>

</html>
